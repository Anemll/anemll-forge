<path d="M341,366 L485,366" fill="none" stroke="#202b35" stroke-width="2" marker-end="url(#arrow)"/>
<text x="650" y="525.0" dominant-baseline="central" text-anchor="middle" font-family="Arial" font-size="23" font-weight="normal" fill="#202b35">64 centroid pairs per matrix</text>
<text x="1090" y="210.0" dominant-baseline="central" text-anchor="middle" font-family="Arial" font-size="23" font-weight="normal" fill="#202b35">Row 2g: scale = 2.0</text>
<rect x="915" y="243" width="350" height="62" rx="6" fill="#eaf1f8" stroke="#566d83" stroke-width="1.5"/>
<text x="1090" y="274.0" dominant-baseline="central" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="#202b35">a = 0.5 × 2.0 = 1.0</text>
<text x="1090" y="357.0" dominant-baseline="central" text-anchor="middle" font-family="Arial" font-size="23" font-weight="normal" fill="#202b35">Row 2g + 1: scale = 0.25</text>
<rect x="915" y="390" width="350" height="62" rx="6" fill="#edf5ef" stroke="#566d83" stroke-width="1.5"/>
