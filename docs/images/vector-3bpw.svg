<text x="1090" y="484.05" dominant-baseline="central" text-anchor="middle" font-family="Arial" font-size="23" font-weight="normal" fill="#202b35">Each row scale is shared</text>
<text x="1090" y="513.95" dominant-baseline="central" text-anchor="middle" font-family="Arial" font-size="23" font-weight="normal" fill="#202b35">across all input columns.</text>
