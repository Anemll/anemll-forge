<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="670" viewBox="0 0 1300 670" role="img" aria-labelledby="title desc">
<title id="title">Three bits per weight with a shared two-component vector codebook</title>
<desc id="desc">At input column j, adjacent output rows 2g and 2g plus 1 share one six-bit index. Illustrative index 7, binary 000111, selects the FP16 centroid pair 0.5 and minus 1.0 from a table of 64 pairs. Separate FP16 row scales 2.0 and 0.25 reconstruct weights 1.0 and minus 0.25. Each scale is shared across its whole output row. Six index bits divided by two weights is three bits per weight, excluding codebook and scale storage.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 Z" fill="#202b35"/>
</marker>
</defs>
<rect width="100%" height="100%" fill="white"/>
<text x="25" y="32.0" dominant-baseline="central" text-anchor="start" font-family="Arial" font-size="30" font-weight="bold" fill="#202b35">3 bpw vector quantization</text>
<text x="25" y="74.0" dominant-baseline="central" text-anchor="start" font-family="Arial" font-size="24" font-weight="normal" fill="#202b35">One joint index selects two FP16 centroid components</text>
<text x="25" y="127.0" dominant-baseline="central" text-anchor="start" font-family="Arial" font-size="25" font-weight="bold" fill="#202b35">1  Pair weight locations</text>
<text x="490" y="127.0" dominant-baseline="central" text-anchor="start" font-family="Arial" font-size="25" font-weight="bold" fill="#202b35">2  Look up one centroid</text>
<text x="900" y="127.0" dominant-baseline="central" text-anchor="start" font-family="Arial" font-size="25" font-weight="bold" fill="#202b35">3  Apply FP16 row scales</text>
<text x="200" y="170.0" dominant-baseline="central" text-anchor="middle" font-family="Arial" font-size="22" font-weight="normal" fill="#202b35">Input column j</text>
<text x="109" y="218.0" dominant-baseline="central" text-anchor="end" font-family="Arial" font-size="22" font-weight="normal" fill="#202b35">2g</text>
<rect x="125" y="195" width="50" height="46" rx="0" fill="white" stroke="#566d83" stroke-width="1.5"/>
<text x="150" y="218.0" dominant-baseline="central" text-anchor="middle" font-family="Arial" font-size="23" font-weight="normal" fill="#202b35">·</text>
<rect x="175" y="195" width="50" height="46" rx="0" fill="#eaf1f8" stroke="#566d83" stroke-width="1.5"/>
<text x="200" y="218.0" dominant-baseline="central" text-anchor="middle" font-family="Arial" font-size="23" font-weight="bold" fill="#202b35">a</text>
